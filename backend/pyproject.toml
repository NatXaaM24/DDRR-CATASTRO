[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.2",
    "geoalchemy2>=0.21.0",
    "ollama>=0.6.3",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "segno>=1.6.6",
    "sqlalchemy>=2.1.8",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]